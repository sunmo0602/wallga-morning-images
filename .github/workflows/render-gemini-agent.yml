name: Render Uploaded ChatGPT Carousel Images
on:
  push:
    paths:
      - 'incoming/gemini-agent-20261011/*.svg'
      - 'scripts/render_gemini_agent.py'
      - '.github/workflows/render-gemini-agent.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-gemini-agent-20261011
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts and image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=11,<13' 'cairosvg>=2.7,<3' 'requests>=2.31,<3'
      - name: Convert six uploaded SVG images to final JPEG
        run: python scripts/render_gemini_agent.py
      - name: Commit actual JPEG images to public image repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published-assets/gemini-agent-20261011/
          if git diff --cached --quiet; then
            echo "No new image bytes to commit"
          else
            git commit -m "Publish six rendered Gemini agent JPEG images"
            git push
          fi
      - name: Upload verified six-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-agent-6-jpegs
          path: published-assets/gemini-agent-20261011/
          retention-days: 14
