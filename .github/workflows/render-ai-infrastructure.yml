name: Convert New AI Infrastructure Carousel to JPEG
on:
  push:
    paths:
      - 'scripts/render_ai_infrastructure_guide.py'
      - '.github/workflows/render-ai-infrastructure.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wallga-ai-infra-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font and image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=11,<13' 'cairosvg>=2.7,<3' 'requests>=2.31,<3'
      - name: Render 6 final JPEG images
        run: python scripts/render_ai_infrastructure_guide.py
      - name: Commit images to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published-assets/ai-infrastructure-guide-20261011/
          if ! git diff --cached --quiet; then
            git commit -m "Upload six new AI infrastructure carousel JPEGs"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: new-ai-infrastructure-carousel
          path: published-assets/ai-infrastructure-guide-20261011/
          retention-days: 14
