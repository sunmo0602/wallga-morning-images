<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="white"/><text x="84" y="90" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="23" fill="#64748b">WALL STREET   /   THE COUNTERARGUMENT</text><text x="84" y="170" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="64" fill="#182d44">통신사 게임 끝?</text><text x="84" y="248" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="64" fill="#182d44">아직은 이르다</text><text x="84" y="313" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="27" fill="#5e7288">주가가 반영한 미래와 현재 실적은 다르다</text><line x1="84" y1="350" x2="996" y2="350" stroke="#ccd5dd"/><rect x="84" y="393" width="912" height="160" rx="16" fill="#f1f4f7"/><text x="113" y="455" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="38" fill="#182d44">01  주파수 확보 ≠ 통신망 완성</text><text x="113" y="510" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="28" fill="#54677a">기지국과 실내 품질에는 시간·자본이 필요</text><rect x="84" y="578" width="912" height="160" rx="16" fill="#f1f4f7"/><text x="113" y="640" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="38" fill="#182d44">02  FCC 최종 승인 전</text><text x="113" y="695" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="28" fill="#54677a">Grain → SpaceX 주파수 양도 규제 조건</text><rect x="84" y="763" width="912" height="160" rx="16" fill="#f1f4f7"/><text x="113" y="825" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="38" fill="#182d44">03  통신탑 수혜는 기대 단계</text><text x="113" y="880" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="28" fill="#54677a">신규 임대 계약은 실제로 확인해야 한다</text><rect x="84" y="948" width="912" height="160" rx="16" fill="#f1f4f7"/><text x="113" y="1010" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="38" fill="#182d44">04  기존 통신사에도 경쟁력</text><text x="113" y="1065" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="28" fill="#54677a">전국망·고객 기반·요금제 결합 효과</text><rect x="84" y="1145" width="912" height="125" rx="12" fill="#e8eff4"/><text x="112" y="1195" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="33" fill="#182d44">시장의 우려 ≠ 실적 감소 확정</text><text x="112" y="1242" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="26" fill="#182d44">다음 분기의 실제 지표가 더 중요하다</text><text x="84" y="1314" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="23" fill="#8c9bad">05 / 06</text><text x="876" y="1314" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="22" fill="#6f7d8f">wallga.morning</text></svg>