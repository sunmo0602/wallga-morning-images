ont-size="26" font-weight="700" fill="#637387" >10.09  |  미국 증시의 반응</text><text x="116" y="845" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="60" font-weight="800" fill="#a14f4d" >TMUS -13.2%</text><text x="116" y="912" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="500" fill="#0f172a" >AT&amp;T·Verizon도 약 10% 하락</text><text x="116" y="960" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="28" font-weight="500" fill="#0f172a" >통신탑 사업자는 반대로 급등</text><rect x="84" y="1103" width="912" height="145" rx="15" fill="#e8edf3"/><text x="114" y="1162" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="700" fill="#173350" >위성 서비스의 사각지대 보완을 넘어</text><text x="114" y="1205" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="30" font-weight="500" fill="#173350" >지상 이동통신시장까지 겨냥한 변화다.</text></svg>