<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}.b{font-weight:700}.r{font-weight:400}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#ffffff"/><text x="72" y="92" font-size="27" fill="#3264a6" class="b">05 / NEXT TO WATCH</text><text x="72" y="177" font-size="54" fill="#111820" class="b">다음 실적에서 확인할 3가지</text><line x1="72" y1="280" x2="1008" y2="280" stroke="#e5e7eb" stroke-width="2"/><line x1="72" y1="1234" x2="1008" y2="1234" stroke="#e5e7eb" stroke-width="2"/><text x="72" y="1284" font-size="24" fill="#77808a" class="r">6/6</text><text x="1008" y="1284" text-anchor="end" font-size="25" fill="#647080">wallga.morning</text><rect x="72" y="324" width="936" height="213" rx="22" fill="#f5f7fa"/><text x="104" y="397" font-size="49" fill="#2563a9" class="b">01</text><text x="245" y="393" font-size="42" fill="#111820" class="b">유료 도입</text><text x="245" y="462" font-size="29" fill="#596474" class="r">기업 고객이 실제로 얼마나 쓰나?</text><rect x="72" y="569" width="936" height="213" rx="22" fill="#f5f7fa"/><text x="104" y="642" font-size="49" fill="#2563a9" class="b">02</text><text x="245" y="638" font-size="42" fill="#111820" class="b">수익성</text><text x="245" y="707" font-size="29" fill="#596474" class="r">추론 비용 대비 매출은 늘어나나?</text><rect x="72" y="814" width="936" height="213" rx="22" fill="#f5f7fa"/><text x="104" y="887" font-size="49" fill="#2563a9" class="b">03</text><text x="245" y="883" font-size="42" fill="#111820" class="b">경쟁력</text><text x="245" y="952" font-size="29" fill="#596474" class="r">MSFT·AMZN·CRM과 차별화되나?</text><text x="72" y="1153" font-size="32" fill="#111820" class="b">다음에 비교할 AI 관련주는?</text><text x="72" y="1202" font-size="28" fill="#2563a9" class="b">댓글로 종목을 남겨주세요.</text></svg>