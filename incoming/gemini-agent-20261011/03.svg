<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}.b{font-weight:700}.r{font-weight:400}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#ffffff"/><text x="72" y="92" font-size="27" fill="#3264a6" class="b">02 / WHY IT MATTERS</text><text x="72" y="177" font-size="54" fill="#111820" class="b">AI 경쟁의 무대가 바뀐다</text><line x1="72" y1="280" x2="1008" y2="280" stroke="#e5e7eb" stroke-width="2"/><line x1="72" y1="1234" x2="1008" y2="1234" stroke="#e5e7eb" stroke-width="2"/><text x="72" y="1284" font-size="24" fill="#77808a" class="r">3/6</text><text x="1008" y="1284" text-anchor="end" font-size="25" fill="#647080">wallga.morning</text><rect x="72" y="326" width="936" height="240" rx="22" fill="#f5f7fa"/><text x="105" y="393" font-size="42" fill="#111820" class="b">1. 질문에 답하는 AI</text><text x="105" y="469" font-size="30" fill="#596474" class="r">정보 검색과 문장 생성 중심</text><rect x="72" y="599" width="936" height="240" rx="22" fill="#f5f7fa"/><text x="105" y="667" font-size="42" fill="#111820" class="b">2. 업무를 수행하는 AI</text><text x="105" y="745" font-size="30" fill="#596474" class="r">문서·메일·코드와 도구 연결</text><rect x="72" y="870" width="936" height="240" rx="22" fill="#f5f7fa"/><text x="105" y="940" font-size="42" fill="#111820" class="b">3. 기업 시스템에 통합</text><text x="105" y="1016" font-size="30" fill="#596474" class="r">보안·권한·비용 관리가 경쟁력</text></svg>