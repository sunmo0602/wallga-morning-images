<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#fff"/><text x="72" y="90" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="27" fill="#2465a4">01 / THE QUESTION</text><text x="72" y="177" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="53" fill="#111820">왜 AI에 전기가 필요할까?</text><text x="72" y="236" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="26" fill="#667085">AI 인프라 산업 구조를 살펴봅니다</text><line x1="72" y1="282" x2="1008" y2="282" stroke="#e5e7eb" stroke-width="2"/><line x1="72" y1="1238" x2="1008" y2="1238" stroke="#e5e7eb" stroke-width="2"/><text x="72" y="1291" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="24" fill="#687385">2/6</text><text x="1008" y="1291" text-anchor="end" font-family="Noto Sans CJK KR" font-size="25" fill="#687385">wallga.morning</text><rect x="72" y="337" width="936" height="344" rx="22" fill="#f3f6f9"/><text x="110" y="416" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="45" fill="#2262a4">AI 모델 학습·추론</text><text x="110" y="510" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="35" fill="#15202b">GPU 서버가 대량의 전력을 사용</text><text x="110" y="585" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="33" fill="#15202b">발열을 식히는 냉각 설비도 필요</text><rect x="72" y="724" width="936" height="333" rx="22" fill="#f3f6f9"/><text x="110" y="805" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="44" fill="#2262a4">중요한 구분</text><text x="110" y="901" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="31" fill="#15202b">AI 수요 증가 ≠ 모든 기업 실적 증가</text><text x="110" y="966" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="29" fill="#15202b">수주·가동률·원가를 확인해야 합니다</text></svg>