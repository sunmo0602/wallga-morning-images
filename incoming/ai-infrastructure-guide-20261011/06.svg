<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#fff"/><text x="72" y="90" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="27" fill="#2465a4">05 / INVESTOR CHECKLIST</text><text x="72" y="177" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="53" fill="#111820">다음에 확인할 3가지</text><line x1="72" y1="282" x2="1008" y2="282" stroke="#e5e7eb" stroke-width="2"/><line x1="72" y1="1238" x2="1008" y2="1238" stroke="#e5e7eb" stroke-width="2"/><text x="72" y="1291" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="24" fill="#687385">6/6</text><text x="1008" y="1291" text-anchor="end" font-family="Noto Sans CJK KR" font-size="25" fill="#687385">wallga.morning</text><rect x="72" y="329" width="936" height="228" rx="22" fill="#f3f6f9"/><text x="102" y="384" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="41" fill="#2262a4">01</text><text x="315" y="381" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="32" fill="#111820">실제 수주</text><text x="315" y="440" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="26" fill="#667085">매출 증가가 신규 계약으로 확인되나</text><rect x="72" y="579" width="936" height="228" rx="22" fill="#f3f6f9"/><text x="102" y="634" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="41" fill="#2262a4">02</text><text x="315" y="631" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="32" fill="#111820">현금흐름</text><text x="315" y="690" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="26" fill="#667085">투자비용 대비 수익성은 좋아지나</text><rect x="72" y="829" width="936" height="228" rx="22" fill="#f3f6f9"/><text x="102" y="884" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="41" fill="#2262a4">03</text><text x="315" y="881" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="32" fill="#111820">전력 병목</text><text x="315" y="940" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" font-size="26" fill="#667085">전력 공급과 인허가가 지연되나</text><text x="72" y="1165" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="30" fill="#2262a4">다음에 비교할 산업은? 댓글로 알려주세요.</text></svg>